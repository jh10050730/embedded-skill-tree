<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 임베디드 스킬 트리 아이콘: 밤하늘 바탕 위의 MCU 칩, 가운데에서 빛나는 START 점 -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#16285a"/>
      <stop offset="1" stop-color="#050914"/>
    </radialGradient>
    <radialGradient id="glow" r="50%">
      <stop offset="0" stop-color="#46dcef" stop-opacity=".9"/>
      <stop offset="1" stop-color="#46dcef" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#sky)"/>
  <circle cx="12" cy="13" r="1.2" fill="#fff" opacity=".8"/>
  <circle cx="52" cy="50" r="1" fill="#fff" opacity=".6"/>
  <circle cx="50" cy="12" r=".8" fill="#fff" opacity=".7"/>
  <!-- 칩 다리 -->
  <path d="M24 10v8M32 10v8M40 10v8M24 46v8M32 46v8M40 46v8M10 24h8M10 32h8M10 40h8M46 24h8M46 32h8M46 40h8"
        stroke="#46dcef" stroke-width="3.2" stroke-linecap="round"/>
  <!-- 칩 몸통 -->
  <rect x="18" y="18" width="28" height="28" rx="5" fill="#0b1222" stroke="#46dcef" stroke-width="3.2"/>
  <!-- 가운데 빛나는 점 -->
  <circle cx="32" cy="32" r="11" fill="url(#glow)"/>
  <circle cx="32" cy="32" r="5" fill="#e8edf8"/>
</svg>
